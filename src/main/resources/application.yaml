spring:
  application:
    name: jshop

  datasource:
    url: jdbc:postgresql://localhost:5433/jshop
    username: jshop
    password: jshop
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8082

api:
  prefix: /api/v1

springdoc:
  swagger-ui:
    path: /swagger-ui.html